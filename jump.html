<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>AETERNA - L'Ascension du Chevalier</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0b140b; color: #e0e0e0; font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif; }
        canvas { display: block; margin: 0 auto; box-shadow: 0 0 100px rgba(0,0,0,0.5); }
        .ui-overlay { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); pointer-events: none; text-align: center; width: 100%; }
        .stats { display: flex; justify-content: space-between; padding: 0 40px; font-size: 18px; text-transform: uppercase; letter-spacing: 2px; color: #8a9a8a; }
        #timerDisp { color: #f1c40f; font-weight: bold; font-size: 24px; }
        #winScreen { 
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 25, 15, 0.98); padding: 50px; border: 4px solid #f1c40f; text-align: center; color: white;
        }
        button { background: #f1c40f; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; font-family: inherit; margin-top: 20px; }
        button:hover { background: #d4ac0d; }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <div class="stats">
            <div id="altitude">ALTITUDE: 0m</div>
            <div id="timerDisp">00:00:00</div>
        </div>
    </div>
    
    <div id="winScreen">
        <h1 style="color: #f1c40f; font-size: 48px; margin: 0;">VICTOIRE</h1>
        <p style="font-size: 20px;">Le sommet est atteint. Temps final :</p>
        <h2 id="finalTime" style="font-size: 60px; color: #fff;">--:--</h2>
        <button onclick="location.reload()">RECOMMENCER L'ASCENSION</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- PARAMÈTRES DU JEU ---
const cfg = {
    w: 600, 
    h: window.innerHeight,
    gravity: 0.28,
    friction: 0.82,
    maxJump: 17.5,
    chargeRate: 0.25,
    worldHeight: 7000 // Hauteur totale du niveau
};

canvas.width = cfg.w;
canvas.height = cfg.h;

let startTime = Date.now();
let gameActive = true;
let cameraY = cfg.worldHeight - cfg.h;

// --- GÉNÉRATION DU DÉCOR (FORÊT) ---
const scenery = [];
for(let i = 0; i < 60; i++) {
    scenery.push({
        x: Math.random() * cfg.w,
        y: Math.random() * cfg.worldHeight,
        size: 30 + Math.random() * 80,
        speed: 0.1 + Math.random() * 0.4, // Effet parallaxe
        type: Math.random() > 0.4 ? 'tree' : 'peak'
    });
}

// --- JOUEUR ---
let p = {
    x: 280, y: cfg.worldHeight - 120,
    vx: 0, vy: 0, w: 34, h: 48,
    isGrounded: false, charge: 0, isCharging: false, dir: 1
};

// --- LEVEL DESIGN (PLATEFORMES) ---
const platforms = [
    { x: 0, y: cfg.worldHeight - 40, w: 600, h: 40, color: '#0a140a' }, // Sol départ
    { x: 400, y: 6750, w: 120, h: 20 },
    { x: 100, y: 6550, w: 100, h: 20 },
    { x: 320, y: 6350, w: 80, h: 20 },
    { x: 80, y: 6150, w: 120, h: 20 },
    { x: 450, y: 5900, w: 60, h: 20 },
    { x: 200, y: 5700, w: 40, h: 20 },
    { x: 50, y: 5500, w: 150, h: 20 },
    { x: 400, y: 5300, w: 50, h: 20 },
    { x: 150, y: 5100, w: 60, h: 20 },
    // AJOUTEZ VOS PLATEFORMES ICI...
    { x: 0, y: 200, w: 600, h: 40, color: '#f1c40f' } // ARRIVÉE (OR)
];

const keys = {};
window.onkeydown = (e) => keys[e.code] = true;
window.onkeyup = (e) => {
    if (e.code === 'Space' && p.isCharging) {
        // SAUT !
        p.vy = -p.charge;
        p.vx = p.dir * (p.charge * 0.45);
        p.isGrounded = false;
        p.isCharging = false;
        p.charge = 0;
    }
    keys[e.code] = false;
};

function drawKnight() {
    ctx.save();
    ctx.translate(p.x + p.w/2, p.y + p.h);
    
    // Effet d'écrasement lors de la charge
    let squash = p.isCharging ? (p.charge / cfg.maxJump) * 12 : 0;
    
    // Cape médiévale
    ctx.fillStyle = "#922b21";
    ctx.beginPath();
    ctx.moveTo(p.dir === 1 ? -15 : 15, -p.h + 18 + squash);
    ctx.lineTo(p.dir === 1 ? -28 : 28, -5);
    ctx.lineTo(p.dir === 1 ? -5 : 5, -5);
    ctx.fill();

    // Armure (Tronc)
    ctx.fillStyle = "#5d6d7e";
    ctx.fillRect(-15, -p.h + 15 + squash, 30, 33 - squash);

    // Heaume (Casque)
    ctx.fillStyle = "#abb2b9";
    ctx.fillRect(-12, -p.h + squash, 24, 18);
    
    // Fente du casque
    ctx.fillStyle = "#1c2833";
    ctx.fillRect(p.dir === 1 ? 0 : -10, -p.h + 6 + squash, 10, 4);

    // Plume
    ctx.fillStyle = "#f1c40f";
    ctx.fillRect(p.dir === 1 ? -4 : 1, -p.h - 8 + squash, 3, 10);

    ctx.restore();
}

function update() {
    if (!gameActive) return;

    // Timer
    let elapsed = Date.now() - startTime;
    let m = Math.floor(elapsed / 60000).toString().padStart(2, '0');
    let s = Math.floor((elapsed % 60000) / 1000).toString().padStart(2, '0');
    let ms = Math.floor((elapsed % 1000) / 10).toString().padStart(2, '0');
    document.getElementById('timerDisp').innerText = `${m}:${s}:${ms}`;

    // Marche au sol
    if (p.isGrounded && !p.isCharging) {
        if (keys['ArrowLeft']) { p.vx = -3.5; p.dir = -1; }
        else if (keys['ArrowRight']) { p.vx = 3.5; p.dir = 1; }
        else p.vx *= cfg.friction;
    }

    // Chargement saut
    if (keys['Space'] && p.isGrounded) {
        p.isCharging = true;
        p.vx = 0;
        p.charge = Math.min(p.charge + cfg.chargeRate, cfg.maxJump);
    }

    // Physique
    p.vy += cfg.gravity;
    p.x += p.vx;
    p.y += p.vy;

    // Murs (Rebond froid)
    if (p.x < 0) { p.x = 0; p.vx *= -0.5; }
    if (p.x + p.w > cfg.w) { p.x = cfg.w - p.w; p.vx *= -0.5; }

    // Collisions Plateformes
    p.isGrounded = false;
    platforms.forEach(plat => {
        if (p.vy >= 0 && p.y + p.h >= plat.y && p.y + p.h <= plat.y + plat.h + 10 &&
            p.x + p.w > plat.x && p.x < plat.x + plat.w) {
            p.isGrounded = true;
            p.y = plat.y - p.h;
            p.vy = 0; p.vx = 0;

            // VICTOIRE !
            if (plat.color === '#f1c40f') {
                gameActive = false;
                document.getElementById('winScreen').style.display = 'block';
                document.getElementById('finalTime').innerText = document.getElementById('timerDisp').innerText;
            }
        }
    });

    // Caméra fluide
    let targetCam = p.y - cfg.h / 1.8;
    cameraY += (targetCam - cameraY) * 0.1;
    document.getElementById('altitude').innerText = `ALTITUDE: ${Math.floor((cfg.worldHeight - p.y)/10)}m`;
}

function draw() {
    // Fond stable (pas de clignotement)
    ctx.fillStyle = "#0b140b";
    ctx.fillRect(0, 0, cfg.w, cfg.h);

    ctx.save();
    ctx.translate(0, -cameraY);

    // Dessin décor (Arbres et Montagnes)
    scenery.forEach(s => {
        ctx.fillStyle = s.type === 'tree' ? "#142514" : "#1a1a2e";
        let scrollY = s.y + (cameraY * s.speed);
        if (s.type === 'tree') {
            ctx.beginPath();
            ctx.moveTo(s.x, scrollY);
            ctx.lineTo(s.x - s.size/2, scrollY + s.size);
            ctx.lineTo(s.x + s.size/2, scrollY + s.size);
            ctx.fill();
        } else {
            ctx.fillRect(s.x, scrollY, s.size, s.size/2);
        }
    });

    // Dessin Plateformes
    platforms.forEach(plat => {
        ctx.fillStyle = plat.color || "#3e2723"; // Brun bois
        ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
        ctx.fillStyle = "rgba(255,255,255,0.05)";
        ctx.fillRect(plat.x, plat.y, plat.w, 5);
    });

    drawKnight();

    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
