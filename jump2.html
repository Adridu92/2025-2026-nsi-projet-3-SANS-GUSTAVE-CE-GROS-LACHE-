<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ascension Royale</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      background: #87ceeb;
    }

    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-size: 22px;
      z-index: 10;
      text-shadow: 2px 2px 5px black;
    }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 50px;
      text-align: center;
      display: none;
      text-shadow: 3px 3px 8px black;
    }
  </style>
</head>
<body>

<div id="ui">
  ⏱ Temps : <span id="timer">0</span>s<br>
  ⛰ Altitude : <span id="altitude">0</span>m
</div>

<div id="message"></div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const gravity = 0.6;

let cameraY = 0;
let gameFinished = false;

const player = {
  x: 100,
  y: 500,
  width: 40,
  height: 40,
  color: "red",
  velX: 0,
  velY: 0,
  speed: 6,
  jump: -14,
  grounded: false
};

const keys = {};

document.addEventListener("keydown", e => {
  keys[e.code] = true;
});

document.addEventListener("keyup", e => {
  keys[e.code] = false;
});

const platforms = [];

for (let i = 0; i < 120; i++) {
  platforms.push({
    x: Math.random() * 1200,
    y: 600 - i * 150,
    width: 180,
    height: 20
  });
}

const princess = {
  x: 500,
  y: -17500,
  width: 60,
  height: 100
};

const startTime = Date.now();

function getZone(y) {
  if (y > -3000) return "foret";
  if (y > -7000) return "temple";
  if (y > -12000) return "montagne";
  return "ciel";
}

function drawBackground() {
  const zone = getZone(player.y);

  if (zone === "foret") {
    ctx.fillStyle = "#3fa34d";
  }
  else if (zone === "temple") {
    ctx.fillStyle = "#b59b6a";
  }
  else if (zone === "montagne") {
    ctx.fillStyle = "#888";
  }
  else {
    ctx.fillStyle = "#4da6ff";
  }

  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawPlatforms() {
  for (let p of platforms) {
    ctx.fillStyle = "#654321";
    ctx.fillRect(p.x, p.y - cameraY, p.width, p.height);
  }
}

function drawPlayer() {
  ctx.fillStyle = player.color;
  ctx.fillRect(player.x, player.y - cameraY, player.width, player.height);
}

function drawPrincess() {
  ctx.fillStyle = "pink";
  ctx.fillRect(
    princess.x,
    princess.y - cameraY,
    princess.width,
    princess.height
  );

  ctx.fillStyle = "yellow";
  ctx.beginPath();
  ctx.arc(
    princess.x + 30,
    princess.y - cameraY - 10,
    20,
    0,
    Math.PI * 2
  );
  ctx.fill();
}

function update() {
  if (gameFinished) return;

  player.velX = 0;

  if (keys["ArrowLeft"] || keys["KeyQ"]) {
    player.velX = -player.speed;
  }

  if (keys["ArrowRight"] || keys["KeyD"]) {
    player.velX = player.speed;
  }

  if ((keys["Space"] || keys["ArrowUp"] || keys["KeyZ"]) && player.grounded) {
    player.velY = player.jump;
    player.grounded = false;
  }

  player.velY += gravity;

  player.x += player.velX;
  player.y += player.velY;

  player.grounded = false;

  for (let p of platforms) {
    if (
      player.x < p.x + p.width &&
      player.x + player.width > p.x &&
      player.y + player.height < p.y + 20 &&
      player.y + player.height + player.velY >= p.y
    ) {
      player.velY = 0;
      player.grounded = true;
      player.y = p.y - player.height;
    }
  }

  if (player.x < 0) player.x = 0;
  if (player.x + player.width > canvas.width)
    player.x = canvas.width - player.width;

  if (player.y - cameraY < canvas.height / 3) {
    cameraY = player.y - canvas.height / 3;
  }

  const altitude = Math.floor((-player.y) / 10);
  document.getElementById("altitude").textContent = altitude;

  const time = Math.floor((Date.now() - startTime) / 1000);
  document.getElementById("timer").textContent = time;

  if (
    player.x < princess.x + princess.width &&
    player.x + player.width > princess.x &&
    player.y < princess.y + princess.height &&
    player.y + player.height > princess.y
  ) {
    finishGame();
  }

  if (player.y > cameraY + canvas.height + 500) {
    player.x = 100;
    player.y = 500;
    player.velY = 0;
    cameraY = 0;
  }
}

function finishGame() {
  gameFinished = true;

  const totalTime = Math.floor((Date.now() - startTime) / 1000);

  const msg = document.getElementById("message");
  msg.style.display = "block";
  msg.innerHTML = `👑 Bravo !<br>Tu as sauvé la princesse !<br><br>Temps : ${totalTime}s`;
}

function drawZoneName() {
  const zone = getZone(player.y);

  ctx.fillStyle = "white";
  ctx.font = "40px Arial";

  let text = "";

  if (zone === "foret") text = "🌳 Forêt";
  if (zone === "temple") text = "🏛 Temple";
  if (zone === "montagne") text = "⛰ Montagne";
  if (zone === "ciel") text = "☁ Royaume céleste";

  ctx.fillText(text, 30, 100);
}

function gameLoop() {
  drawBackground();
  update();
  drawPlatforms();
  drawPrincess();
  drawPlayer();
  drawZoneName();

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
